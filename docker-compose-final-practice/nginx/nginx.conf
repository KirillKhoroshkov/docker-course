worker_processes auto;
pid /var/run/nginx/nginx.pid;

events {}

http {
    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format galactic '[$time_local] 🌌 $remote_addr -> $upstream_addr '
                       '"$request" $status $body_bytes_sent '
                       'response_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log galactic;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=10s;

    upstream menu_service_backend {
        # Выделяем общую память для воркеров Nginx (обязательно для resolve)
        zone menu_zone 64k;
        # Для обновления IP на лету, чтобы изменение числа реплик автоматически обнаружилось
        server menu-service:8000 resolve max_fails=1 fail_timeout=10s;
    }

    upstream order_service_backend {
        # Выделяем общую память для воркеров Nginx (обязательно для resolve)
        zone order_zone 64k;
        # Для обновления IP на лету, чтобы изменение числа реплик автоматически обнаружилось
        server order-service:8001 resolve max_fails=1 fail_timeout=10s;
    }

    # Main server configuration
    server {
        listen 80;
        server_name localhost galactic-pizza;

        # Menu Service Proxy
        location /api/menu {
            # Proxy settings
            proxy_pass http://menu_service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;

            # Headers for service identification
            proxy_set_header X-Service-Route "menu-service";
            add_header X-Upstream-Server $upstream_addr always;
        }

        # Order Service Proxy
        location /api/orders {
            # Proxy settings
            rewrite ^/api/orders/$ /api/orders break;
            proxy_pass http://order_service_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts (longer for order processing)
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # Error handling
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 60s;

            # Headers for service identification
            proxy_set_header X-Service-Route "order-service";
            add_header X-Upstream-Server $upstream_addr always;
        }

        # Frontend SPA via dedicated service
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_cache_bypass $http_upgrade;
        }

        # Error pages
        error_page 404 /errors/404.html;
        error_page 500 502 503 504 /errors/50x.html;

        location = /errors/404.html {
            root /usr/share/nginx/html;
            internal;
        }

        location = /errors/50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
